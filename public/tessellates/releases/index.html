<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="/main.css">
    <script src="/api-state.js"></script>
    <script>
    (function () {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark-mode') {
          document.documentElement.setAttribute('data-theme', 'dark-mode');
        } else {
          document.documentElement.setAttribute('data-theme', 'light-mode');
        }
    })();
    </script>
    <script src="/tessellations/timeout-functions.js"></script>
    <script src="/releases/releases.js"></script>
  </head>
  <body>
    <div id="release-header-section" class="centre padding-vert">
      <div id="release-header-title">
        <span id="release-title"></span>
      </div>
    </div>

    <div id="cover-art-section" class="centre padding-vert">
      <img id="cover-art" src="" alt="cover art">
    </div>

    <div id="annotations-section" class="centre padding-vert">
      <div id="annotations"></div>
    </div>

    <div id="release-header-section" class="centre">
      <div id="release-display">
        <span id="release-header"></span>
        <button id="release-edit-btn" class="small-btn">&#9999;&#65039;</button>
      </div>
      <div id="release-edit-form">
        <input id="edit-artist" class="edit-input" type="text" size="18"> -
        <input id="edit-title" class="edit-input" type="text" size="22">
        [<input id="edit-label" class="edit-input" type="text" size="14">]
        <button id="release-save-btn" class="small-btn">&#128190;</button>
        <button id="release-cancel-btn" class="small-btn">&#10060;</button>
      </div>
    </div>
    <div id="metadata-section" class="centre">
      <div id="metadata"></div>
    </div>
    <div id="tracklist-section" class="centre">
      <div id="tracklist"></div>
    </div>
  </body>
</html>
