<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="/main.css">
    <script src="/api-state.js"></script>
    <script src="/dark-mode.js"></script>
    <script src="/params.js"></script>
    <script src="/api-helpers.js"></script>
    <script src="/ui/animation-helpers.js"></script>
    <script src="/ui/image-helpers.js"></script>
    <script src="/ui/ui-helpers.js"></script>
    <script src="/ui/render-helpers.js"></script>
    <script src="/vlc-helpers.js"></script>
    <script src="/tessellations/timeout-functions.js"></script>
    <script src="/tessellations/triangle.js"></script>
    <script src="/tessellations/square.js"></script>
    <script src="/tessellations/circle.js"></script>
    <script src="/tessellations/rhombus.js"></script>
    <script src="/tessellations/octagon.js"></script>
    <script src="/collections/collections.js"></script>
  </head>
  <body>
    <div class="centre padding-vert" id="text">tessellates</div>
    <div class="centre padding-vert" id="track-text">-</div>
    
    <div class="tessellation-container">
      <div id="image-grid" class="image-grid">
      </div>
      <div id="big-image-container" class="big-image-container">
        <div id="big-image-wrapper" class="big-image-wrapper">
        </div>
      </div>
    </div>
    
    <div class="centre padding-vert">
      <button id="back-big" type="button"> &#x21C7; </button>
      <button id="back-medium" type="button"> &#x21A4; </button>
      <button id="back-small" type="button"> &lt; </button>
      <button id="forward-small" type="button"> &gt; </button>
      <button id="forward-medium" type="button"> &#x21A6; </button>
      <button id="forward-big" type="button"> &#x21C9; </button>
      <span id="annotation-span">
        /
        <a id="release-edit-link" class="disabled-link" href="#" target="_blank"><button> &#9999;&#65039; </button></a>
      </span>
    </div>
    <div class="centre padding-vert">
      <input type="text" id="release-year-input" name="release-year" size="12" placeholder="release-year">
      |
      <input type="text" id="purchase-date-input" name="purchase-date" size="12" placeholder="purchase-year">
      |
      <input type="text" id="filter-input" name="filter" size="15" placeholder="artist-title-label">
      |
      <input type="text" id="sort-input" name="sort" size="10" placeholder="sort (atlyp)">
      |
      <button type="button" id="filter-submit">filter =></button>
      ?
      <button type="button" id="random">anywhere</button>
    </div>
    <div id="folders-div" class="centre padding-vert" style="display: none;">
      <!-- Folder buttons are inserted here by loadFolders() in collections.js -->
      <button class="emoji-button" id="all" type="button"> &#10060; </button>
    </div>
    <div id="playback-div" class="centre padding-vert" style="visibility: hidden;">
      <button id="enable-local-playback">&#x1F4FB;</button>
      <button id="pause-local-playback" disabled>&#x23f8; / &#x25b6;</button>
      <button id="clear-local-playback" disabled>&#x23f9; + &#x1f191;</button>
    </div>
    
    <div class="centre padding-vert">
      <a href="/settings">
        <button type="button" id="settings-button">&#x3A3;etttings</button>
      </a>
    </div>
  </body>
</html>
